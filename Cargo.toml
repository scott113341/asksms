[package]
name = "asksms"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
dotenvy = "0.15.7"
hmac = "0.13.0"
reqwest = { version = "0.13.5", features = ["json", "form"] }
rig-core = "0.46.0"
rig-reqwest = "0.46.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
serde_urlencoded = "0.7.1"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
