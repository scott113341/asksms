# Each [[provider]] is a model plus the settings it answers with. Any setting
# left out uses production's value (see AnswerConfig in src/llm.rs):
#
#   plugins            OpenRouter plugins; production uses the web plugin with a
#                      custom search_prompt. Use [] for none.
#   reasoning          minimal, low, medium, high, xhigh or max. Unset by default.
#   instructions       The system prompt.
#   max_output_tokens  Production uses 8000.
#
# Answers are cached by these settings, not by name, so you can rename a
# provider freely. Changing any setting asks every question again for it.

[[provider]]
name = "sonar"
model = "perplexity/sonar"

# Production's settings before 2026-11-06: a 128-token limit, the old prompt and
# the web plugin's default search prompt.
[[provider]]
name = "sonar-before"
model = "perplexity/sonar"
max_output_tokens = 128
instructions = "Focus on being clear and direct. DO NOT use emojis, Markdown, or citations. Use only raw plaintext compatible with GSM-7 encoding."
plugins = [{ id = "web" }]

# Today's prompt and limit, but the web plugin's default search prompt.
[[provider]]
name = "sonar-default-search-prompt"
model = "perplexity/sonar"
plugins = [{ id = "web" }]

[[provider]]
name = "claude-opus-5.5"
model = "anthropic/claude-opus-5.5"

[[provider]]
name = "gpt-6-luna"
model = "openai/gpt-6-luna"

[[provider]]
name = "kimi-k3.1-pro"
model = "moonshotai/kimi-k3.1-pro"
